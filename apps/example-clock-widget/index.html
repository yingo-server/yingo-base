<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例组件</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f5f6f8);
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
    padding: 22px 28px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.06);
  }
  .time { font-size: 38px; font-weight: 700; color: #1f2328; font-variant-numeric: tabular-nums; }
  .date { margin-top: 6px; font-size: 13px; color: #8b949e; }
</style>
</head>
<body>
<div class="card">
  <div class="time" id="time">--:--:--</div>
  <div class="date" id="date"></div>
</div>
<script>
  function tick() {
    var now = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    document.getElementById('time').textContent =
      p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds());
    var weeks = ['日', '一', '二', '三', '四', '五', '六'];
    document.getElementById('date').textContent =
      now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 星期' + weeks[now.getDay()];
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
